<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Card — Vencimento do boleto, Veículos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{card.fonte_titulo_url}}:wght@400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap">
<style>
:root{--ink:#0F1419;--g3:{{cor.acento}};--g4:{{cor.acento_escuro}};--g5:{{cor.acento_profundo}};--g6:{{cor.acento_faixa}};
  --ouro-escuro:linear-gradient(180deg,{{cor.acento_medio}} 0%,{{cor.acento_escuro}} 45%,{{cor.acento_profundo}} 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1058px;overflow:hidden;background:{{cor.acento_breu}}}
body{font-family:'{{identidade_visual.fonte_titulo}}',system-ui,sans-serif;color:var(--ink);position:relative}
.abs{position:absolute}
.foto{inset:0;background:url(__FOTO:[[caminho da foto do card]]__) center 60%/cover;filter:grayscale(1) contrast(1.05) brightness(.9)}
.tinta{inset:0;background:linear-gradient(160deg,rgba({{cor.acento_faixa_rgb}},.74) 0%,rgba({{cor.acento_sombra_rgb}},.74) 55%,rgba({{cor.acento_noite_rgb}},.86) 100%);mix-blend-mode:multiply}
.veu{inset:0;background:linear-gradient(160deg,rgba({{cor.acento_escuro_rgb}},.22),rgba(15,20,25,.30))}
.painel{left:120px;top:124px;width:843px;height:819px;border-radius:30px;
  background:linear-gradient(180deg,#F7F7F8 0%,#EEEEF0 100%);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.atencao{left:120px;width:843px;top:196px;padding-top:24px;padding-bottom:40px;text-align:center;font-size:150px;font-weight:700;line-height:1;letter-spacing:-.02em;
  background:var(--ouro-escuro);-webkit-background-clip:text;background-clip:text;color:transparent}
.pilula{left:228px;top:393px;width:626px;height:135px;border-radius:70px;border:2px solid var(--g5);
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:31px;font-weight:600;line-height:1.3}
.pilula b{font-weight:800;color:var(--g5)}
.aviso{left:120px;width:843px;top:574px;text-align:center;font-size:36px;line-height:1.24;color:var(--g6)}
.aviso b{font-weight:700;color:var(--g5)}
.marca{left:120px;width:843px;top:726px;text-align:center}
.marca .js{font-size:80px;font-weight:900;line-height:1;letter-spacing:-.02em;
  background:var(--ouro-escuro);-webkit-background-clip:text;background-clip:text;color:transparent}
.marca .nome{font-size:30px;font-weight:800;line-height:1.1;margin-top:2px}
.contato{left:120px;width:843px;top:836px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:27px;font-weight:700;color:var(--g5)}
.contato svg{width:30px;height:30px}
.etiqueta{left:392px;top:880px;width:296px;height:66px;border-radius:12px;background:#FFFFFF;
  box-shadow:0 8px 20px rgba(15,20,25,.18);display:flex;align-items:center;justify-content:center;
  font-family:'Dancing Script',cursive;font-size:36px;color:var(--ink)}
.trevo{left:872px;top:872px;width:122px;height:122px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
</style></head>
<body>
<div class="abs foto"></div><div class="abs tinta"></div><div class="abs veu"></div>
<div class="abs painel"></div>
<div class="abs atencao">Atenção</div>
<div class="abs pilula"><div>O Vencimento do Boleto do<br>Consórcio de Veículos é <b>HOJE</b></div></div>
<div class="abs aviso"><b>Não fique fora do Sorteio,</b><br>em necessidade de uma segunda<br>via do boleto entre em contato</div>
<div class="abs marca"><div class="js">{{card.iniciais}}</div><div class="nome">{{card.nome_caixa_alta}}</div></div>
<div class="abs contato"><svg viewBox="0 0 64 64"><circle cx="32" cy="31" r="25" fill="none" stroke="{{cor.acento_profundo}}" stroke-width="5"/><path d="M12 56l4-13" stroke="{{cor.acento_profundo}}" stroke-width="5" stroke-linecap="round"/><path fill="{{cor.acento_profundo}}" d="M24.5 19.5c1-.9 2.6-.8 3.3.3l2.6 4.3c.5.9.3 2-.4 2.7l-1.6 1.5c1.4 3.2 3.9 5.8 7.3 7.3l1.5-1.6c.7-.8 1.8-.9 2.7-.4l4.3 2.6c1.1.7 1.3 2.3.3 3.3l-2 2c-1.6 1.6-4 2.1-6.1 1.2-6.6-2.7-11.8-7.9-14.5-14.5-.9-2.1-.4-4.5 1.2-6.1z"/></svg>{{consultor.telefone}}</div>
<div class="abs etiqueta">{{consultor.assinatura}}</div>
<svg class="abs trevo" viewBox="0 0 100 100"><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{cor.acento_brilho}}"/><stop offset=".55" stop-color="{{cor.acento}}"/><stop offset="1" stop-color="{{cor.acento_profundo}}"/></linearGradient></defs>
  <g fill="url(#gt)"><path d="M50 50 C38 40 26 30 30 18 C34 8 46 8 50 20 C54 8 66 8 70 18 C74 30 62 40 50 50Z" transform="rotate(0 50 50)"/><path d="M50 50 C38 40 26 30 30 18 C34 8 46 8 50 20 C54 8 66 8 70 18 C74 30 62 40 50 50Z" transform="rotate(90 50 50)"/><path d="M50 50 C38 40 26 30 30 18 C34 8 46 8 50 20 C54 8 66 8 70 18 C74 30 62 40 50 50Z" transform="rotate(180 50 50)"/><path d="M50 50 C38 40 26 30 30 18 C34 8 46 8 50 20 C54 8 66 8 70 18 C74 30 62 40 50 50Z" transform="rotate(270 50 50)"/></g><path d="M52 54 C58 70 60 82 56 96" stroke="{{cor.acento_escuro}}" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
</body></html>
