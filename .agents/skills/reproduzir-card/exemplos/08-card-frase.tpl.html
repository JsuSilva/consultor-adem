<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Card — Frase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{card.fonte_titulo_url}}:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap">
<style>
:root{--g3:{{cor.acento}};--g4:{{cor.acento_escuro}};--ink:#0F1419;
  --ouro:linear-gradient(90deg,{{cor.acento_brilho}} 0%,{{cor.acento}} 50%,{{cor.acento_escuro}} 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'{{identidade_visual.fonte_titulo}}',system-ui,sans-serif;color:#fff;position:relative}
.abs{position:absolute}
.foto{inset:0;background:url(__FOTO:[[caminho da foto do card]]__) center/cover}
.veu{inset:0;background:linear-gradient(180deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,.88) 100%)}
.marca{left:80px;top:78px;display:flex;align-items:center;gap:20px}
.marca .js{font-size:62px;font-weight:900;line-height:1;letter-spacing:-.02em;
  background:linear-gradient(160deg,{{cor.acento_brilho}},{{cor.acento}} 50%,{{cor.acento_escuro}});-webkit-background-clip:text;background-clip:text;color:transparent}
.marca .sep{width:1px;height:58px;background:rgba(255,255,255,.3)}
.marca .nome{font-size:26px;font-weight:700;line-height:1.1}
.marca .cargo{font-size:15px;font-weight:300;color:#9CA3AF}
.frase{left:100px;width:880px;top:660px;font-size:78px;font-weight:300;line-height:1.24;letter-spacing:-.02em}
.frase b{font-weight:600;background:var(--ouro);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:14px}
.frase .fio{margin-top:36px;width:72px;height:2px;background:var(--g3)}
.rod{left:80px;top:1706px;width:920px;display:flex;align-items:center;justify-content:space-between;white-space:nowrap}
.rod .n{font-size:24px;font-weight:700;letter-spacing:.12em}
.rod .t{font-size:15px;font-weight:300;letter-spacing:.14em;color:#9CA3AF;margin-top:4px}
.rod .c{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;color:#fff}
.rod .c svg{width:40px;height:40px}
.rod .s{font-size:18px;font-weight:300;color:#D1D5DB;margin-top:4px;text-align:right}
</style></head>
<body>
<div class="abs foto"></div><div class="abs veu"></div>
<div class="abs marca"><div class="js">{{card.monograma}}</div><div class="sep"></div><div><div class="nome">{{card.nome_caixa_alta}}</div><div class="cargo">{{consultor.cargo}}</div></div></div>
<div class="abs frase">[[primeira parte da frase]]<br><b>[[segunda parte da frase, em degradê]]</b><div class="fio"></div></div>
<div class="abs rod">
  <div><div class="n">{{card.nome_caixa_alta}}</div><div class="t">{{card.cargo_caixa_alta}}</div></div>
  <div><div class="c"><svg viewBox="0 0 64 64"><circle cx="32" cy="31" r="25" fill="none" stroke="{{cor.acento}}" stroke-width="4.5"/><path d="M12 56l4-13" stroke="{{cor.acento}}" stroke-width="4.5" stroke-linecap="round"/><path fill="{{cor.acento}}" d="M24.5 19.5c1-.9 2.6-.8 3.3.3l2.6 4.3c.5.9.3 2-.4 2.7l-1.6 1.5c1.4 3.2 3.9 5.8 7.3 7.3l1.5-1.6c.7-.8 1.8-.9 2.7-.4l4.3 2.6c1.1.7 1.3 2.3.3 3.3l-2 2c-1.6 1.6-4 2.1-6.1 1.2-6.6-2.7-11.8-7.9-14.5-14.5-.9-2.1-.4-4.5 1.2-6.1z"/></svg>{{consultor.telefone}}</div><div class="s">{{consultor.site}}</div></div>
</div>
</body></html>
