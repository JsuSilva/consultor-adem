<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Card — Cota do cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{card.fonte_titulo_url}}:wght@300;400;500;600;700;800;900&display=swap">
<style>
:root{--g3:{{cor.acento}};--ouro:linear-gradient(90deg,{{cor.acento_claro}},{{cor.acento_brilho}} 38%,{{cor.acento}} 72%,{{cor.acento_escuro}})}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#000}
body{font-family:'{{identidade_visual.fonte_titulo}}',system-ui,sans-serif;color:#fff;position:relative}
.abs{position:absolute}
.fundo{inset:0;background:url(__FOTO:[[caminho da foto do card]]__) center 62%/cover}
.veu{inset:0;background:linear-gradient(180deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.86) 52%,rgba(0,0,0,.72) 74%,rgba(0,0,0,.92) 100%),
  radial-gradient(60% 40% at 50% 12%,rgba({{cor.acento_escuro_rgb}},.22),transparent 65%)}
.marca{left:0;top:66px;width:1080px;display:flex;align-items:center;justify-content:center;gap:18px}
.marca .js{font-size:56px;font-weight:900;line-height:1;letter-spacing:-.02em;
  background:var(--ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.marca .sep{width:1px;height:52px;background:rgba(255,255,255,.25)}
.marca .nome{font-size:24px;font-weight:700;line-height:1.1}
.marca .cargo{font-size:14px;font-weight:300;color:#9CA3AF}
.rotulo{left:0;top:208px;width:1080px;text-align:center;font-size:19px;font-weight:600;letter-spacing:.3em;color:var(--g3)}
.painel{left:96px;top:262px;width:888px;height:548px;border-radius:28px;
  background:linear-gradient(180deg,rgba(17,21,26,.92),rgba(6,7,9,.95));
  border:2px solid rgba({{cor.acento_rgb}},.42);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.cred{left:96px;top:310px;width:888px;text-align:center;font-size:21px;font-weight:600;letter-spacing:.22em;color:#D1D5DB}
.valor{left:96px;top:348px;width:888px;text-align:center;font-size:124px;font-weight:900;line-height:1;
  letter-spacing:-.03em;padding-bottom:16px;
  background:var(--ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.valor small{font-size:.46em}
.fio{left:300px;top:518px;width:480px;height:2px;background:linear-gradient(90deg,transparent,rgba({{cor.acento_rgb}},.85),transparent)}
.pares{left:96px;top:558px;width:888px;display:grid;grid-template-columns:1fr 1fr}
.par{text-align:center;padding:0 20px}
.par+.par{border-left:1px solid rgba(255,255,255,.14)}
.par .r{font-size:19px;font-weight:600;letter-spacing:.2em;color:#9CA3AF}
.par .v{font-size:64px;font-weight:800;line-height:1.1;margin-top:8px;
  background:var(--ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.adm{left:96px;top:696px;width:888px;text-align:center}
.adm .r{font-size:17px;font-weight:600;letter-spacing:.2em;color:#9CA3AF}
.adm .v{font-size:34px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:6px;color:#FFFFFF}
.assin{left:0;top:876px;width:1080px;text-align:center}
.assin .n{font-size:26px;font-weight:700;letter-spacing:.14em}
.assin .c{font-size:15px;font-weight:300;letter-spacing:.16em;color:#9CA3AF;margin-top:4px}
.assin .z{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;font-size:30px;font-weight:800}
.assin .z svg{width:38px;height:38px}
</style></head>
<body>
<div class="abs fundo"></div><div class="abs veu"></div>

<div class="abs marca"><div class="js">{{card.monograma}}</div><div class="sep"></div><div><div class="nome">{{card.nome_caixa_alta}}</div><div class="cargo">{{consultor.cargo}}</div></div></div>

<div class="abs rotulo">CONSÓRCIO DE [[modalidade, em caixa alta]]</div>
<div class="abs painel"></div>
<div class="abs cred">CRÉDITO CONTRATADO</div>
<div class="abs valor"><small>R$</small> [[crédito contratado]]</div>
<div class="abs fio"></div>
<div class="abs pares">
  <div class="par"><div class="r">GRUPO</div><div class="v">[[grupo]]</div></div>
  <div class="par"><div class="r">COTA</div><div class="v">[[cota]]</div></div>
</div>

<div class="abs adm"><div class="r">ADMINISTRADORA</div><div class="v">{{administradora.nome}}</div></div>
<div class="abs assin">
  <div class="n">{{card.nome_caixa_alta}}</div>
  <div class="c">{{card.cargo_caixa_alta}}</div>
  <div class="z">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="31" r="25" fill="none" stroke="{{cor.acento}}" stroke-width="4.5"/><path d="M12 56l4-13" stroke="{{cor.acento}}" stroke-width="4.5" stroke-linecap="round"/><path fill="{{cor.acento}}" d="M24.5 19.5c1-.9 2.6-.8 3.3.3l2.6 4.3c.5.9.3 2-.4 2.7l-1.6 1.5c1.4 3.2 3.9 5.8 7.3 7.3l1.5-1.6c.7-.8 1.8-.9 2.7-.4l4.3 2.6c1.1.7 1.3 2.3.3 3.3l-2 2c-1.6 1.6-4 2.1-6.1 1.2-6.6-2.7-11.8-7.9-14.5-14.5-.9-2.1-.4-4.5 1.2-6.1z"/></svg>
    {{consultor.telefone}}
  </div>
</div>
</body></html>
